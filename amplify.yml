version: 1
backend:
  phases:
    build:
      commands:
        - npm install --legacy-peer-deps
        - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
frontend:
  phases:
    preBuild:
      commands:
        - npm install --legacy-peer-deps
        - echo "VITE_LAMBDA_VITALSCAN=$VITE_LAMBDA_VITALSCAN" >> .env
        - echo "VITE_LAMBDA_CLEARSCRIPT=$VITE_LAMBDA_CLEARSCRIPT" >> .env
        - echo "VITE_LAMBDA_TRUEMEDS=$VITE_LAMBDA_TRUEMEDS" >> .env
        - echo "VITE_LAMBDA_HYDROGUARD=$VITE_LAMBDA_HYDROGUARD" >> .env
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - .npm/**/*
